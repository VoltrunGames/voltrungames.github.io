<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voltrun Games</title>
<meta name="description" content="Voltrun Games – Entwickler von Ice Smash! Eishockey.">
<style>
  :root{--bg:#0f2236;--card:#16324c;--txt:#eaf4ff;--mut:#a9c2da;--acc:#ffd23f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  main{max-width:560px;width:100%;background:var(--card);border-radius:18px;padding:32px 28px;text-align:center}
  h1{margin:0 0 4px;font-size:30px;letter-spacing:.5px}
  .sub{color:var(--mut);margin:0 0 28px}
  h2{margin:0 0 8px;font-size:22px}
  p{line-height:1.5;color:var(--mut)}
  a.btn{display:inline-block;margin-top:12px;background:var(--acc);color:#3a2a00;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:12px}
  footer{margin-top:28px;font-size:13px;color:var(--mut)}
  footer a{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Voltrun Games</h1>
  <p class="sub">Spiele aus Berlin</p>
  <h2>Ice Smash! Eishockey</h2>
  <p>Schnelles Arcade-Eishockey für Kinder und Familien: Tore schießen, Gegner umchecken, Pokale gewinnen und lustige Figuren sammeln.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.voltrungames.icesmash">Bei Google Play laden</a>
  <footer>Kontakt: <a href="mailto:voltrun-games@web.de">voltrun-games@web.de</a></footer>
</main>
</body>
</html>
